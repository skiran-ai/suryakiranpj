databases:
  - name: suryakiran-portfolio-db
    databaseName: portfolio_db
    user: portfolio_user
    plan: free

services:
  - type: web
    name: suryakiran-portfolio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_portfolio && python manage.py collectstatic --noinput"
    startCommand: "gunicorn portfolio_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: suryakiran-portfolio-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: "suryakiran-portfolio-api.onrender.com,api.suryakiranpj.com,suryakiranpj.com,www.suryakiranpj.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.suryakiranpj.com,https://suryakiranpj.com,https://suryakiranpj.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://www.suryakiranpj.com,https://suryakiranpj.com,https://suryakiranpj.netlify.app"
      - key: GEMINI_API_KEY
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "suryakiranpjineesh@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "suryakiranpjineesh@gmail.com"
      - key: CONTACT_EMAIL
        value: "suryakiranpjineesh@gmail.com"
